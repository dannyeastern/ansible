---
- name: Deploy FTP on Ubuntu hosts
  hosts: ubuntu
  become: yes
  become_method: sudo

  vars_files:
  - vars/linuxsecrets.yml

  pre_tasks:
  - name: Update apt repository cache, if necessary
    apt: update_cache=yes cache_valid_time=3600

  handlers:
  - name: restart vsftpd
    service: name=vsftpd state=restarted
  
  tasks:
  - name: Install vsftpd
    apt:
      name: vsftpd
      state: present

  - name: Ensure vsftpd is enabled & started
    service: name=vsftpd state=started enabled=yes

  - name: Create anonymous FTP root directory
    file:
      path: /srv/ftp
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Create anonymous upload directory
    file:
      path: /srv/ftp/upload
      state: directory
      owner: ftp
      group: nogroup
      mode: '0733'

  - name: Create README file
    copy:
      dest: /srv/ftp/README.txt
      content: |
        Welcome to the FTP server.
        Anonymous FTP is enabled for downloads.
        Local users may upload files.
        Anonymous uploads should go in /upload.
      owner: root
      group: root
      mode: '0444'

  - name: Enable anonymous FTP
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^anonymous_enable='
      line: 'anonymous_enable=YES'
    notify: restart vsftpd

  - name: Enable local users
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^local_enable='
      line: 'local_enable=YES'
    notify: restart vsftpd

  - name: Enable write access
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^write_enable='
      line: 'write_enable=YES'
    notify: restart vsftpd

  - name: Set anonymous root folder
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^anon_root='
      line: 'anon_root=/srv/ftp'
    notify: restart vsftpd

  - name: Allow anonymous uploads
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^anon_upload_enable='
      line: 'anon_upload_enable=YES'
    notify: restart vsftpd

  - name: Allow anonymous mdir
    lineinfile:
      path: /etc/vsftpd.conf
      regexp: '^anon_mkdir_write_enable='
      line: 'anon_mkdir_write_enable=YES'
    notify: restart vsftpd

  - name: Show common values
    debug:
      msg: "host={{ inventory_hostname }}, user={{ ansible_user }}, os={{ ansible_facts['os_family'] }}"
