---
- name: Mount Windows backup share on Fedora hosts
  hosts: fedora
  become: yes
  become_method: sudo

  vars_files:
    - vars/linuxsecrets.yml

  vars:
    windows_share_ip: "172.16.1.253"
    windows_share_name: "backups"
    windows_username: "adojo"
    cifs_credentials_file: "/root/.backup-credentials"

  tasks:
    - name: Install CIFS utilities
      dnf:
        name: cifs-utils
        state: present

    - name: Create /backup mount point
      file:
        path: /backup
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create CIFS credentials file
      copy:
        dest: "{{ cifs_credentials_file }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          username={{ windows_username }}
          password={{ windows_pass }}

    - name: Mount Windows backup share
      ansible.posix.mount:
        path: /backup
        src: "//{{ windows_share_ip }}/{{ windows_share_name }}"
        fstype: cifs
        opts: "credentials={{ cifs_credentials_file }},iocharset=utf8,uid=0,gid=0,file_mode=0644,dir_mode=0755"
        state: mounted

    - name: Show common values
      debug:
         msg: "host={{ inventory_hostname }}, user={{ ansible_user }}, os={{ ansible_facts['os_family'] }}"
