---
- name: Deploy Apache Web Server on Linux hosts
  hosts: linux
  become: yes
  become_method: sudo

  tasks:
    - name: Allow HTTP through firewalld on Fedora
      firewalld:
        service: http
        state: enabled
        permanent: yes
        immediate: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Allow HTTP through UFW on Ubuntu
      community.general.ufw:
        rule: allow
        port: 80
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Apache on Fedora
      dnf:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Apache on Ubuntu
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Copy the local web content to the remote system
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      with_items:
        - src: index.html
          dest: /var/www/html/index.html

    - name: Ensure Apache is running and started at boot time on Fedora
      service:
        name: httpd
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "RedHat"

    - name: Ensure Apache is running and started at boot time on Ubuntu
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_facts['os_family'] == "Debian"
