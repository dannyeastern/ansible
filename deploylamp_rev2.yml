---
- name: Deploy LAMP on Ubuntu hosts
  hosts: ubuntu
  become: yes
  become_method: sudo
  
  vars:
    users:
      - shaggy
      - buju
      - redrat
  vars_files:
  - vars/linuxsecrets.yml

  pre_tasks:
  - name: Update apt repository cache, if necessary
    apt: update_cache=yes cache_valid_time=3600

  handlers:
  - name: restart apache
    service: name=apache2 state=restarted
  
  tasks:
  - name: Install LAMP packages
    apt:
      state: present
      name:
      - apache2
      - mariadb-server
      - mariadb-client
      - php

  - name: Disable the firewall
    service: name=ufw state=stopped

  - name: Start Apache and MariaDB
    service: "name={{ item }} state=started enabled=yes"
#    with_items:
    loop:
    - apache2
    - mariadb

  - name: Enable Apache userdir module for home directory hosting
    apache2_module: name=userdir state=present
    notify: restart apache

  - name: Create multiple users
    user:
      name: "{{ item }}"
      state: present
      create_home: yes
    with_items: "{{ users }}"

  - name: Set permissions on user home directories
    file:
      path: "/home/{{ item }}"
      state: directory
      owner: "{{ item }}"
      group: "{{ item }}"
      mode: '0755'
    with_items: "{{ users }}"

  - name: Create public_html for each user
    file:
      path: "/home/{{ item }}/public_html"
      state: directory
      owner: "{{ item }}"
      group: "{{ item }}"
      mode: '0755'
    with_items: "{{ users }}"

  - name: Copy index.html for each user
    copy:
      src: index.html
      dest: "/home/{{ item }}/public_html/index.html"
      owner: "{{ item }}"
      group: "{{ item }}"
      mode: '0644'
    with_items: "{{ users }}"
